<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poukaz: Vltava Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #D8E0E6;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  svg { width: 100%; max-width: 1295px; height: auto; display: block; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; }
  .sans  { font-family: "Outfit", "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1295 498" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Darčekový poukaz: Vltava Run, 7. 5. až 10. 5. 2027">
  <!-- 2.6:1 overall so it fills the gift page's image frame: a 1247×450 ticket with a
       24px page-coloured margin. Scenes are drawn in the original 820×520 panel
       coordinates (x 40–860, y 40–560); the panel shows y 60–510 of that, stretched
       6 % horizontally to 870 wide. -->
  <defs>
    <clipPath id="ticket">
      <rect width="1247" height="450" rx="28"/>
    </clipPath>
    <clipPath id="leftPanel">
      <rect width="870" height="450"/>
    </clipPath>
    <g id="flake" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/>
      <line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
    </g>
    <path id="star" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#D9B45A"/>
  </defs>

  <rect width="1295" height="498" fill="#D8E0E6"/>
  <rect x="24" y="30" width="1247" height="450" rx="28" fill="#1E2F3D" opacity="0.08"/>

  <g transform="translate(24,24)">
  <g clip-path="url(#ticket)">
  <rect width="1247" height="450" fill="#EAF0F4"/>

  <!-- LEFT: scene -->
  <g clip-path="url(#leftPanel)">
    <g transform="scale(1.061 1) translate(-40 -60)">
    <!-- snowflakes (subtle) -->
    <use href="#flake" transform="translate(640,104)"/>
    <use href="#flake" transform="translate(700,64) scale(0.7)"/>
    <use href="#flake" transform="translate(820,150) scale(0.8)"/>
    <use href="#flake" transform="translate(610,250) scale(0.6)"/>

    <!-- star above Prague -->
    <use href="#star" transform="translate(790,92)"/>

    <!-- back hills (Šumava) -->
    <polygon fill="#E6BDB3" points="40,330 130,298 230,318 340,282 450,306 560,290 660,316 760,300 860,312 860,560 40,560"/>

    <!-- Prague skyline at the finish -->
    <g fill="#C98579">
      <rect x="672" y="296" width="96" height="14"/>
      <rect x="702" y="282" width="46" height="16"/>
      <polygon points="706,282 711,262 716,282"/>
      <polygon points="718,282 723,262 728,282"/>
      <rect x="734" y="258" width="12" height="26"/>
      <polygon points="732,258 740,236 748,258"/>
      <rect x="682" y="288" width="8" height="10"/>
      <polygon points="680,288 686,278 692,288"/>
    </g>

    <!-- front hills -->
    <polygon fill="#C98579" points="40,410 150,372 260,396 360,358 450,384 530,366 610,350 700,372 790,352 860,366 860,560 40,560"/>

    <!-- foreground banks -->
    <polygon fill="#2E5247" points="40,492 160,470 290,488 420,474 560,492 700,468 860,482 860,560 40,560"/>

    <!-- the Vltava -->
    <path fill="#A9C3D1" d="M598,312 C640,330 668,352 630,376 C580,408 470,420 450,456 C432,490 470,526 500,560 L310,560 C330,520 340,480 380,448 C430,410 560,390 600,364 C624,348 610,326 590,312 Z"/>
    <g fill="#FFFFFF" opacity="0.7">
      <rect x="548" y="392" width="34" height="4" rx="2"/>
      <rect x="408" y="458" width="26" height="4" rx="2"/>
      <rect x="396" y="486" width="32" height="4" rx="2"/>
    </g>

    <!-- pines -->
    <g fill="#1F3B34">
      <polygon points="95,450 79.6,476.4 86.8,476.4 76.8,498 113.2,498 103.2,476.4 110.4,476.4"/>
      <polygon points="128,468 117.1,486.7 122.2,486.7 115.1,502 140.9,502 133.8,486.7 138.9,486.7"/>
      <polygon points="720,445 703.4,473.6 711.2,473.6 700.2,497 739.8,497 728.8,473.6 736.6,473.6"/>
      <polygon points="756,456 743.8,476.9 749.5,476.9 741.6,494 770.4,494 762.5,476.9 768.2,476.9"/>
      <polygon points="808,448 793.3,473.3 800.2,473.3 790.5,494 825.5,494 815.8,473.3 822.7,473.3"/>
    </g>

    <!-- runner on the riverbank -->
    <g transform="translate(222,464) scale(1.15)" fill="#1E2F3D">
      <rect x="-3.25" y="-3.25" width="24.0" height="6.5" rx="3.25" transform="rotate(121.0 0 0)"/>
      <rect x="-12" y="12" width="23.1" height="6" rx="3" transform="rotate(159.4 -9 15)"/>
      <rect x="4.25" y="-32.75" width="22.5" height="5.5" rx="2.75" transform="rotate(135.0 7 -30)"/>
      <rect x="-7.5" y="-20.5" width="16.3" height="5" rx="2.5" transform="rotate(-135.0 -5 -18)"/>
      <rect x="-6.5" y="-6.5" width="43.8" height="13" rx="6.5" fill="#A8665E" transform="rotate(-76.9 0 0)"/>
      <rect x="-3.25" y="-3.25" width="24.0" height="6.5" rx="3.25" transform="rotate(31.0 0 0)"/>
      <rect x="12" y="6" width="27.2" height="6" rx="3" transform="rotate(98.1 15 9)"/>
      <rect x="9.5" y="27.5" width="12.0" height="5" rx="2.5"/>
      <rect x="4.25" y="-32.75" width="20.4" height="5.5" rx="2.75" transform="rotate(47.7 7 -30)"/>
      <rect x="14.5" y="-21.5" width="18.5" height="5" rx="2.5" transform="rotate(-48.0 17 -19)"/>
      <circle cx="12" cy="-44" r="7.5"/>
    </g>
    </g>

    <!-- title block -->
    <text x="64" y="70" class="sans" font-size="21" font-weight="500" fill="#A8665E">Darčekový poukaz</text>
    <text x="60" y="172" class="serif" font-size="104" fill="#1E2F3D">Vltava Run</text>
  </g>

  <!-- RIGHT: stub (centre x 1058.5) -->
  <rect x="870" width="377" height="450" fill="#1F3B34"/>
  <use href="#flake" transform="translate(1210,46) scale(0.7)" opacity="0.25"/>
  <use href="#flake" transform="translate(912,420) scale(0.6)" opacity="0.2"/>

  <g text-anchor="middle" fill="#F3F6F8" transform="translate(48.5,-35)">
    <text x="1010" y="130" class="sans" font-size="19" opacity="0.7">Termín</text>
    <text x="1010" y="202" class="serif" font-size="56">7. 5.</text>
    <text x="1010" y="242" class="sans" font-size="18" opacity="0.7">až</text>
    <text x="1010" y="302" class="serif" font-size="56">10. 5.</text>
    <text x="1010" y="346" class="sans" font-size="22" letter-spacing="6">2027</text>
  </g>

  <!-- holly sprig -->
  <g transform="translate(48.5,-80)">
    <ellipse cx="995" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(-25 995 484)"/>
    <ellipse cx="1025" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(25 1025 484)"/>
    <circle cx="1005" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1015" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1010" cy="483" r="5.5" fill="#C2453B"/>
  </g>

  <!-- perforation -->
  <line x1="870" y1="32" x2="870" y2="418" stroke="#EAF0F4" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="870" cy="0" r="20" fill="#D8E0E6"/>
  <circle cx="870" cy="450" r="20" fill="#D8E0E6"/>
  </g>
  </g>
</svg>
</body>
</html>
