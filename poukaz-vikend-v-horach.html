<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poukaz: Víkend v horách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #D8E0E6;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  svg { width: 100%; max-width: 1170px; height: auto; display: block; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; }
  .sans  { font-family: "Outfit", "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1170 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Darčekový poukaz: Víkend v horách, približne 4 dni, predĺžený víkend, termín podľa dohody">
  <!-- Full-bleed ticket at 2.6:1 so it fills the gift page's image frame.
       Scenes are drawn in the original 820×520 panel coordinates (x 40–860, y 40–560);
       the panel shows y 60–510 of that, stretched 6 % horizontally to 870 wide. -->
  <defs>
    <clipPath id="leftPanel">
      <rect x="0" y="0" width="870" height="450"/>
    </clipPath>
    <g id="flake" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/>
      <line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
    </g>
    <path id="star" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#D9B45A"/>
  </defs>

  <rect width="1170" height="450" fill="#EAF0F4"/>

  <!-- LEFT: scene -->
  <g clip-path="url(#leftPanel)">
    <g transform="scale(1.061 1) translate(-40 -60)">
    <!-- snowflakes (subtle) -->
    <use href="#flake" transform="translate(560,120)"/>
    <use href="#flake" transform="translate(700,92) scale(0.7)"/>
    <use href="#flake" transform="translate(820,170) scale(0.8)"/>
    <use href="#flake" transform="translate(760,84) scale(0.6)"/>

    <!-- star over the summit -->
    <use href="#star" transform="translate(706,170)"/>

    <!-- back range -->
    <polygon fill="#E6BDB3" points="40,380 140,342 230,360 330,318 420,338 520,292 590,316 706,222 760,270 812,248 860,280 860,560 40,560"/>
    <polygon fill="#FFFFFF" points="706,222 692,240 699,237 706,245 713,236 720,240"/>
    <polygon fill="#FFFFFF" points="520,292 510,302 515,300 520,306 526,299 531,302"/>
    <polygon fill="#FFFFFF" points="812,248 802,259 807,257 812,263 817,257 823,259"/>

    <!-- front ridge -->
    <polygon fill="#C98579" points="40,440 160,398 280,416 400,368 500,392 600,338 700,376 800,350 860,362 860,560 40,560"/>

    <!-- meadow -->
    <path fill="#2E5247" d="M40,474 C200,456 360,446 520,428 C640,414 760,404 860,414 L860,560 L40,560 Z"/>

    <!-- trail up to the hut -->
    <polygon fill="#EAF0F4" points="394.8,583.6 400.6,578.3 406.6,573.3 412.9,568.4 419.4,563.8 426.1,559.4 433.1,555.2 440.3,551.1 447.7,547.2 455.3,543.5 463.1,539.9 471.1,536.4 479.2,533.1 487.4,529.8 495.8,526.7 504.2,523.6 512.8,520.5 521.4,517.5 530.1,514.6 538.8,511.6 547.5,508.6 556.3,505.6 565.0,502.6 573.7,499.5 582.4,496.3 591.1,493.0 599.7,489.6 608.2,486.1 616.6,482.4 624.8,478.5 633.0,474.4 641.0,470.2 648.9,465.7 656.6,461.0 664.1,456.0 671.4,450.8 678.4,445.3 685.3,439.5 691.8,433.3 698.2,426.9 704.2,420.1 699.8,415.9 693.3,421.8 686.6,427.3 679.7,432.4 672.5,437.2 665.3,441.6 657.8,445.8 650.2,449.7 642.4,453.3 634.5,456.7 626.5,459.8 618.3,462.8 610.0,465.6 601.6,468.2 593.1,470.7 584.5,473.0 575.9,475.3 567.1,477.5 558.3,479.6 549.4,481.6 540.5,483.6 531.5,485.6 522.5,487.6 513.5,489.6 504.4,491.7 495.4,493.9 486.3,496.1 477.3,498.4 468.3,500.9 459.3,503.5 450.4,506.2 441.5,509.2 432.6,512.3 423.8,515.8 415.1,519.4 406.5,523.4 398.0,527.7 389.6,532.3 381.3,537.3 373.1,542.6 365.2,548.4"/>

    <!-- mountain hut -->
    <g>
      <rect x="680" y="392" width="46" height="24" fill="#F3F6F8"/>
      <rect x="712" y="364" width="7" height="16" fill="#1E2F3D"/>
      <polygon points="670,395 703,368 736,395" fill="#1E2F3D"/>
      <rect x="686" y="400" width="9" height="9" fill="#D9B45A"/>
      <rect x="704" y="400" width="10" height="16" fill="#A8665E"/>
    </g>

    <!-- trail sign with the red stripe marking -->
    <g>
      <rect x="288" y="462" width="5" height="50" rx="1" fill="#1E2F3D"/>
      <polygon points="270,462 314,462 322,471 314,480 270,480" fill="#F3F6F8"/>
      <rect x="278" y="468" width="22" height="6" fill="#C2453B"/>
    </g>

    <!-- pines -->
    <g fill="#1F3B34">
      <polygon points="95,456 79.6,482.4 86.8,482.4 76.8,504 113.2,504 103.2,482.4 110.4,482.4"/>
      <polygon points="130,470 119.1,488.7 124.2,488.7 117.1,504 142.9,504 135.8,488.7 140.9,488.7"/>
      <polygon points="190,462 177.8,482.9 183.5,482.9 175.6,500 204.4,500 196.5,482.9 202.2,482.9"/>
      <polygon points="770,388 756.8,410.6 763,410.6 754.4,429 785.6,429 777,410.6 783.2,410.6"/>
      <polygon points="806,396 795.1,414.7 800.2,414.7 793.1,430 818.9,430 811.8,414.7 816.9,414.7"/>
      <polygon points="640,470 627.8,490.9 633.5,490.9 625.6,508 654.4,508 646.5,490.9 652.2,490.9"/>
    </g>

    <!-- hiker on the trail -->
    <g transform="translate(544.0,500.1) scale(1.25)" fill="#1E2F3D">
      <rect x="1.25" y="-64.75" width="22.1" height="5.5" rx="2.75" transform="rotate(115.0 4 -62)"/>
      <rect x="-5.5" y="-49.5" width="15.3" height="5" rx="2.5" transform="rotate(119.1 -3 -47)"/>
      <rect x="-9.25" y="-39.25" width="42.3" height="2.5" rx="1.25" transform="rotate(107.5 -8 -38)"/>
      <rect x="-3.5" y="-37.5" width="24.7" height="7" rx="3.5" transform="rotate(106.4 0 -34)"/>
      <rect x="-8" y="-20" width="23.5" height="6" rx="3" transform="rotate(113.6 -5 -17)"/>
      <rect x="-16.25" y="-2.25" width="12.5" height="4.5" rx="2.25" transform="rotate(0.0 -14 0)"/>
      <rect x="-17" y="-66" width="15" height="30" rx="5" fill="#A8665E" transform="rotate(8 -10 -50)"/>
      <rect x="-6" y="-40" width="40.3" height="12" rx="6" transform="rotate(-81.9 0 -34)"/>
      <rect x="-3.5" y="-37.5" width="24.9" height="7" rx="3.5" transform="rotate(63.4 0 -34)"/>
      <rect x="5" y="-21" width="23.3" height="6" rx="3" transform="rotate(80.0 8 -18)"/>
      <rect x="6.75" y="-2.25" width="13.5" height="4.5" rx="2.25" transform="rotate(0.0 9 0)"/>
      <rect x="1.25" y="-64.75" width="21.6" height="5.5" rx="2.75" transform="rotate(60.3 4 -62)"/>
      <rect x="9.5" y="-50.5" width="15.6" height="5" rx="2.5" transform="rotate(48.8 12 -48)"/>
      <rect x="17.75" y="-41.25" width="43.3" height="2.5" rx="1.25" transform="rotate(78.7 19 -40)"/>
      <circle cx="8" cy="-73" r="7"/>
      <path d="M0,-75 a8,7.5 0 0,1 16,0 z"/>
      <rect x="12" y="-76.5" width="7" height="3" rx="1.5"/>
    </g>
    </g>

    <!-- title block -->
    <text x="64" y="70" class="sans" font-size="21" font-weight="500" fill="#A8665E">Darčekový poukaz</text>
    <text x="60" y="172" class="serif" font-size="76" fill="#1E2F3D">Víkend v horách</text>
  </g>

  <!-- RIGHT: stub -->
  <rect x="870" y="0" width="300" height="450" fill="#1F3B34"/>
  <use href="#flake" transform="translate(1128,46) scale(0.7)" opacity="0.25"/>
  <use href="#flake" transform="translate(912,420) scale(0.6)" opacity="0.2"/>

  <g text-anchor="middle" fill="#F3F6F8" transform="translate(10,-35)">
    <text x="1010" y="130" class="sans" font-size="19" opacity="0.7">Termín</text>
    <text x="1010" y="202" class="serif" font-size="56">~ 4 dni</text>
    <text x="1010" y="242" class="sans" font-size="18" opacity="0.7">predĺžený víkend</text>
    <text x="1010" y="302" class="serif" font-size="40">podľa</text>
    <text x="1010" y="346" class="serif" font-size="40">dohody</text>
  </g>

  <!-- holly sprig -->
  <g transform="translate(10,-80)">
    <ellipse cx="995" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(-25 995 484)"/>
    <ellipse cx="1025" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(25 1025 484)"/>
    <circle cx="1005" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1015" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1010" cy="483" r="5.5" fill="#C2453B"/>
  </g>

  <!-- perforation -->
  <line x1="870" y1="32" x2="870" y2="418" stroke="#EAF0F4" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="870" cy="0" r="20" fill="#D8E0E6"/>
  <circle cx="870" cy="450" r="20" fill="#D8E0E6"/>
</svg>
</body>
</html>
