<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poukaz: {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #D8E0E6;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  svg { width: 100%; max-width: 1200px; height: auto; display: block; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; }
  .sans  { font-family: "Outfit", "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{ARIA}}">
  <defs>
    <clipPath id="leftPanel">
      <path d="M68,40 H860 V560 H68 A28,28 0 0 1 40,532 V68 A28,28 0 0 1 68,40 Z"/>
    </clipPath>
    <g id="flake" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/>
      <line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
    </g>
    <path id="star" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#D9B45A"/>
  </defs>

  <!-- card shadow + body -->
  <rect x="40" y="46" width="1120" height="520" rx="28" fill="#1E2F3D" opacity="0.08"/>
  <rect x="40" y="40" width="1120" height="520" rx="28" fill="#EAF0F4"/>

  <!-- LEFT: scene -->
  <g clip-path="url(#leftPanel)">
    <rect x="40" y="40" width="820" height="520" fill="#EAF0F4"/>

{{SCENE}}

    <!-- title block -->
    <text x="100" y="122" class="sans" font-size="21" font-weight="500" fill="#A8665E">Darčekový poukaz</text>
    <text x="96" y="226" class="serif" font-size="{{TITLE_SIZE}}" fill="#1E2F3D">{{TITLE}}</text>
  </g>

  <!-- RIGHT: stub -->
  <path d="M860,40 H1132 A28,28 0 0 1 1160,68 V532 A28,28 0 0 1 1132,560 H860 Z" fill="#1F3B34"/>
  <use href="#flake" transform="translate(1118,92) scale(0.7)" opacity="0.25"/>
  <use href="#flake" transform="translate(905,525) scale(0.6)" opacity="0.2"/>

  <g text-anchor="middle" fill="#F3F6F8" transform="translate(0,40)">
{{STUB}}
  </g>

  <!-- holly sprig -->
  <g>
    <ellipse cx="995" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(-25 995 484)"/>
    <ellipse cx="1025" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(25 1025 484)"/>
    <circle cx="1005" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1015" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1010" cy="483" r="5.5" fill="#C2453B"/>
  </g>

  <!-- perforation -->
  <line x1="860" y1="72" x2="860" y2="528" stroke="#EAF0F4" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="860" cy="40" r="20" fill="#D8E0E6"/>
  <circle cx="860" cy="560" r="20" fill="#D8E0E6"/>
</svg>
</body>
</html>
