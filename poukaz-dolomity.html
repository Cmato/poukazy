<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poukaz: Dolomity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #D8E0E6;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  svg { width: 100%; max-width: 1200px; height: auto; display: block; }
  .serif { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 600; }
  .sans  { font-family: "Outfit", "Segoe UI", system-ui, sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Darčekový poukaz: Dolomity, 27. 10. až 31. 10. 2027">
  <defs>
    <clipPath id="leftPanel">
      <path d="M68,40 H860 V560 H68 A28,28 0 0 1 40,532 V68 A28,28 0 0 1 68,40 Z"/>
    </clipPath>
    <g id="flake" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.1" y1="-3.5" x2="6.1" y2="3.5"/>
      <line x1="-6.1" y1="3.5" x2="6.1" y2="-3.5"/>
    </g>
    <path id="star" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z" fill="#D9B45A"/>
  </defs>

  <!-- card shadow + body -->
  <rect x="40" y="46" width="1120" height="520" rx="28" fill="#1E2F3D" opacity="0.08"/>
  <rect x="40" y="40" width="1120" height="520" rx="28" fill="#EAF0F4"/>

  <!-- LEFT: scene -->
  <g clip-path="url(#leftPanel)">
    <rect x="40" y="40" width="820" height="520" fill="#EAF0F4"/>

    <!-- snowflakes (subtle) -->
    <use href="#flake" transform="translate(520,118)"/>
    <use href="#flake" transform="translate(600,78) scale(0.7)"/>
    <use href="#flake" transform="translate(808,150) scale(0.8)"/>
    <use href="#flake" transform="translate(790,72) scale(0.6)"/>
    <use href="#flake" transform="translate(455,300) scale(0.6)"/>

    <!-- star above the highest peak -->
    <use href="#star" transform="translate(760,92)"/>

    <!-- back range (alpenglow) -->
    <polygon fill="#E6BDB3" points="40,420 120,360 170,385 250,300 300,340 360,290 420,330 480,250 520,280 560,180 590,210 620,140 650,190 680,120 710,170 740,150 790,230 860,200 860,560 40,560"/>
    <polygon fill="#FFFFFF" points="680,120 669,145 675,140 681,148 688,140 695,145"/>
    <polygon fill="#FFFFFF" points="620,140 611,160 616,156 621,163 627,155 632,160"/>
    <polygon fill="#FFFFFF" points="560,180 552,200 557,196 562,203 568,195 573,200"/>

    <!-- front range -->
    <polygon fill="#C98579" points="40,470 140,420 220,450 300,390 350,420 420,340 460,370 520,300 545,320 575,230 600,260 625,190 650,250 670,215 700,300 760,270 820,330 860,310 860,560 40,560"/>
    <polygon fill="#FFFFFF" points="625,190 616,214 621,209 627,217 632,209 635,214"/>
    <polygon fill="#FFFFFF" points="575,230 568,252 574,246 580,255 586,246 593,252"/>
    <polygon fill="#FFFFFF" points="670,215 660,232 665,228 669,235 673,229 676,232"/>
    <polygon fill="#FFFFFF" points="420,340 403,360 412,354 420,362 430,353 446,360"/>

    <!-- foreground hill + pines -->
    <polygon fill="#2E5247" points="40,505 200,482 360,500 520,472 700,494 860,478 860,560 40,560"/>
    <g fill="#1F3B34">
      <polygon points="95,462 79.6,488.4 86.8,488.4 76.8,510 113.2,510 103.2,488.4 110.4,488.4"/>
      <polygon points="125,478 114.1,496.7 119.2,496.7 112.1,512 137.9,512 130.8,496.7 135.9,496.7"/>
      <polygon points="300,475 290.4,491.5 294.9,491.5 288.6,505 311.4,505 305.1,491.5 309.6,491.5"/>
      <polygon points="720,453 703.4,481.6 711.2,481.6 700.2,505 739.8,505 728.8,481.6 736.6,481.6"/>
      <polygon points="755,462 742.8,482.9 748.5,482.9 740.6,500 769.4,500 761.5,482.9 767.2,482.9"/>
      <polygon points="800,452 785.3,477.3 792.2,477.3 782.5,498 817.5,498 807.8,477.3 814.7,477.3"/>
    </g>

    <!-- title block -->
    <text x="100" y="122" class="sans" font-size="21" font-weight="500" fill="#A8665E">Darčekový poukaz</text>
    <text x="96" y="226" class="serif" font-size="104" fill="#1E2F3D">Dolomity</text>
  </g>

  <!-- RIGHT: stub -->
  <path d="M860,40 H1132 A28,28 0 0 1 1160,68 V532 A28,28 0 0 1 1132,560 H860 Z" fill="#1F3B34"/>
  <use href="#flake" transform="translate(1118,92) scale(0.7)" opacity="0.25"/>
  <use href="#flake" transform="translate(905,525) scale(0.6)" opacity="0.2"/>

  <g text-anchor="middle" fill="#F3F6F8" transform="translate(0,40)">
    <text x="1010" y="130" class="sans" font-size="19" opacity="0.7">Termín</text>
    <text x="1010" y="202" class="serif" font-size="56">27. 10.</text>
    <text x="1010" y="242" class="sans" font-size="18" opacity="0.7">až</text>
    <text x="1010" y="302" class="serif" font-size="56">31. 10.</text>
    <text x="1010" y="346" class="sans" font-size="22" letter-spacing="6">2027</text>
  </g>

  <!-- holly sprig -->
  <g>
    <ellipse cx="995" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(-25 995 484)"/>
    <ellipse cx="1025" cy="484" rx="17" ry="7" fill="#6F9B7E" transform="rotate(25 1025 484)"/>
    <circle cx="1005" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1015" cy="475" r="5.5" fill="#C2453B"/>
    <circle cx="1010" cy="483" r="5.5" fill="#C2453B"/>
  </g>

  <!-- perforation -->
  <line x1="860" y1="72" x2="860" y2="528" stroke="#EAF0F4" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>
  <circle cx="860" cy="40" r="20" fill="#D8E0E6"/>
  <circle cx="860" cy="560" r="20" fill="#D8E0E6"/>
</svg>
</body>
</html>
